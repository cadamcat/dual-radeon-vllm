<line x1="62" y1="426" x2="84" y2="426" stroke="#8b6ee0" stroke-width="3" stroke-dasharray="7 4"/>
<text x="91" y="430" font-size="11.5" fill="#8a8a8a">right panel, prefill: the same ratio &#183; hollow: a rung the ledger does not grade on one of the two arms</text>
<text x="62" y="457" font-size="10" fill="#8a8a8a" opacity=".75">slope: least squares of ms per decoded token on context over the rungs all three ladders share, 500 to 32 000, which is the number</text>
<text x="62" y="472" font-size="10" fill="#8a8a8a" opacity=".75">the Findings quote; the steepest is 3.00x the flattest. Patches, from the rows: the 0.23.1 arm carries vllm#45916 split-KV,</text>
<text x="62" y="487" font-size="10" fill="#8a8a8a" opacity=".75">the window block-skip and vllm#45450; the 0.27.1 arms carry vllm#45916 split-KV. The version step also changes ROCm and the weight</text>
<text x="62" y="502" font-size="10" fill="#8a8a8a" opacity=".75">kernel (Triton W4A16 to the native RDNA hybrid kernel); within 0.27.1 only the backend flag changes. Hollow prefill rung: 500.</text>
<text x="62" y="517" font-size="10" fill="#8a8a8a" opacity=".75">decode.jsonl and prefill.jsonl, RX 7900 XT rows; campaign-2026-09-03 and campaign-2026-09-07 are the campaigns, and the latter holds the</text>
<text x="62" y="532" font-size="10" fill="#8a8a8a" opacity=".75">drift control that prices the session boundary between its two arms.</text>
</svg>
