<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<meta name="description" content="__DESC__">
<style>
  /* ===================== theme =====================
     Light lives on bare :root so a viewer with no preference and no stored
     choice still gets a complete palette. Dark is applied twice: once for the
     system preference (unless the reader has explicitly chosen light) and once
     for an explicit dark choice, so the toggle wins in both directions. */
  :root {
    --bg:#f7f4ed; --bg-grad:radial-gradient(1100px 560px at 80% -10%, #efe7d5 0%, rgba(239,231,213,0) 62%);
    --surface:#fffdf8; --surface-2:#f2eee3; --surface-3:#e9e4d6;
    --border:#e0d9c8; --border-2:#cfc7b2;
    --text:#1e1b15; --text-2:#544e3f; --text-dim:#736b59;
    --accent:#a06a12; --accent-2:#7d5208;
    --red:#b4402a; --red-bg:#f8e8e3; --green:#1e7548; --green-bg:#e3f1e8;
    --blue:#1d6390; --blue-bg:#e3edf4;
    --code-bg:#1c1a15; --code-bg-2:#26231c; --code-bar:#2f2b22;
    --code-text:#eae4d5; --code-dim:#9a927d;
    --shadow:0 1px 2px rgba(46,38,14,.05), 0 10px 32px rgba(46,38,14,.07);
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code","Roboto Mono",Menlo,Consolas,
           "PingFang SC","Noto Sans SC",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    /* qualitative series set, tuned for legibility on paper and on near-black */
    --s1:#c1462c; --s2:#1c6b96; --s3:#2d7d54; --s4:#6b47b2; --s5:#a5761a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#100e0a; --bg-grad:radial-gradient(1100px 580px at 82% -12%, #241d0e 0%, rgba(36,29,14,0) 64%);
      --surface:#191711; --surface-2:#211e16; --surface-3:#2b271d;
      --border:#332f23; --border-2:#45402f;
      --text:#ede7d7; --text-2:#b9b19c; --text-dim:#8b8371;
      --accent:#e0aa46; --accent-2:#f2c56b;
      --red:#ea7a60; --red-bg:#33201b; --green:#5fc086; --green-bg:#16281d;
      --blue:#5fabe2; --blue-bg:#142430;
      --code-bg:#0b0a07; --code-bg-2:#15140e; --code-bar:#1e1c14;
      --code-text:#e6e0cf; --code-dim:#8a8269;
      --shadow:0 1px 2px rgba(0,0,0,.32), 0 12px 36px rgba(0,0,0,.38);
      --s1:#f08a6d; --s2:#63b3e0; --s3:#67c795; --s4:#b096ec; --s5:#e7b45c;
    }
  }
  :root[data-theme="dark"] {
    --bg:#100e0a; --bg-grad:radial-gradient(1100px 580px at 82% -12%, #241d0e 0%, rgba(36,29,14,0) 64%);
    --surface:#191711; --surface-2:#211e16; --surface-3:#2b271d;
    --border:#332f23; --border-2:#45402f;
    --text:#ede7d7; --text-2:#b9b19c; --text-dim:#8b8371;
    --accent:#e0aa46; --accent-2:#f2c56b;
    --red:#ea7a60; --red-bg:#33201b; --green:#5fc086; --green-bg:#16281d;
    --blue:#5fabe2; --blue-bg:#142430;
    --code-bg:#0b0a07; --code-bg-2:#15140e; --code-bar:#1e1c14;
    --code-text:#e6e0cf; --code-dim:#8a8269;
    --shadow:0 1px 2px rgba(0,0,0,.32), 0 12px 36px rgba(0,0,0,.38);
    --s1:#f08a6d; --s2:#63b3e0; --s3:#67c795; --s4:#b096ec; --s5:#e7b45c;
  }

  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    margin:0; background:var(--bg); background-image:var(--bg-grad); background-attachment:fixed;
    color:var(--text); font-family:var(--sans); line-height:1.78; font-size:17px;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    transition:background-color .35s ease, color .35s ease;
  }
  .wrap { max-width:880px; margin:0 auto; padding:0 24px 120px; }
  @media (max-width:640px){ body{font-size:16px;} .wrap{padding:0 16px 80px;} }
  a { color:var(--accent-2); text-decoration:none; border-bottom:1px solid transparent;
      transition:color .2s ease, border-color .25s ease; }
  a:hover { border-bottom-color:var(--accent); }
  h1,h2,h3,h4 { line-height:1.3; font-weight:700; color:var(--text); }
  h1 { font-size:2.45rem; letter-spacing:-.022em; margin:.2em 0 .3em; }
  @media (max-width:640px){ h1{font-size:1.85rem;} }
  h2 { font-size:1.6rem; margin:3.4em 0 .25em; letter-spacing:-.012em; }
  h2 .n { color:var(--accent); font-variant-numeric:tabular-nums; margin-right:.55em; font-weight:800; }
  /* the section number settles into place with its heading. It starts dim and
     offset rather than invisible: this is static markup, and an observer that
     never fires -- a background tab, no IntersectionObserver at all -- must
     leave the page readable rather than blank. */
  h2 .n.nq { display:inline-block; color:var(--text-dim); transform:translateX(-.3em);
             transition:color .55s ease, transform .55s cubic-bezier(.22,1,.36,1); }
  h2 .n.nin { color:var(--accent); transform:none; }
  h3 { font-size:1.16rem; margin:2.2em 0 .1em; }
  p { margin:.9em 0; }
  strong { color:var(--text); font-weight:700; }
  code { font-family:var(--mono); font-size:.86em; background:var(--surface-3);
         padding:.12em .38em; border-radius:4px; border:1px solid var(--border);
         overflow-wrap:anywhere; }
  /* the title says what was found; the subtitle is the line the article used to
     lead with, kept because it says what the piece is about */
  .top .sub { font-size:1.28rem; line-height:1.42; font-weight:400; color:var(--text-dim);
              margin:.15em 0 0; letter-spacing:-.008em; }
  @media (max-width:640px){ .top .sub{ font-size:1.06rem; } }
  .lede { font-size:1.13rem; color:var(--text-2); margin:1.1em 0 0; }

  /* ---- theme toggle ---- */
  /* fixed, so content scrolls under it; it steps out of the way going down the
     page and comes back on any upward scroll, which keeps it reachable without
     covering a figure title on a narrow screen */
  .themebar { position:fixed; top:14px; right:16px; z-index:60; display:flex; gap:4px;
              transition:transform .3s cubic-bezier(.22,1,.36,1), opacity .3s;
              background:color-mix(in srgb, var(--surface) 88%, transparent);
              border:1px solid var(--border); border-radius:99px; padding:4px;
              box-shadow:var(--shadow); backdrop-filter:blur(10px); }
  .themebar button { border:0; background:transparent; cursor:pointer; border-radius:99px;
                     width:30px; height:30px; display:grid; place-items:center;
                     color:var(--text-dim); transition:background .2s, color .2s; }
  .themebar button:hover { color:var(--text-2); }
  .themebar button:active { transform:scale(.88); }
  .themebar button[aria-pressed="true"] { background:var(--surface-3); color:var(--accent); }
  .themebar svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.9;
                  stroke-linecap:round; stroke-linejoin:round; }
  .themebar .sep { width:1px; align-self:stretch; margin:3px 3px; background:var(--border); }
  .themebar .lang { font-family:var(--mono); font-size:.73rem; font-weight:700; letter-spacing:.02em;
                    height:30px; padding:0 .62em; display:grid; place-items:center; border-radius:99px;
                    color:var(--text-dim); border-bottom:0; transition:background .2s, color .2s; }
  .themebar .lang:hover { color:var(--text-2); }
  .themebar .lang[aria-current="page"] { background:var(--surface-3); color:var(--accent); }
  .themebar.away { transform:translateY(-150%); opacity:0; pointer-events:none; }
  @media (max-width:640px){ .themebar { top:8px; right:8px; } }

  /* ---- masthead ---- */
  .top { border-bottom:1px solid var(--border); margin-bottom:2.4em; padding:2.6em 0 1.7em; }
  .kicker { font-family:var(--mono); font-size:.75rem; letter-spacing:.15em; text-transform:uppercase;
            color:var(--accent); font-weight:700; }
  .meta { display:flex; flex-wrap:wrap; gap:.5em; margin-top:1.5em; }
  .chip { font-family:var(--mono); font-size:.73rem; background:var(--surface-2);
          border:1px solid var(--border); border-radius:99px; padding:.32em .85em; color:var(--text-2); }
  .chip b { color:var(--text); font-weight:700; }
  /* chips are typed, and the type is the dot: hardware, model, stack, platform,
     scale, upstream, date. The dot is decoration, so the type is also spelled
     out in the chip's own words rather than carried by colour alone. */
  .chip::before { content:""; display:inline-block; width:5px; height:5px; border-radius:99px;
                  margin-right:.55em; vertical-align:.1em; background:var(--ck,var(--text-dim)); }
  .chip.k-hardware { --ck:var(--s2); }
  .chip.k-model    { --ck:var(--s4); }
  .chip.k-stack    { --ck:var(--s3); }
  .chip.k-platform { --ck:var(--s5); }
  .chip.k-upstream { --ck:var(--s1); }
  .chip.k-date     { --ck:var(--accent); }
  .chip.k-scale    { --ck:var(--text-dim); }
  .chip.k-link::before { display:none; }
  /* the masthead chips land one after another; --i is written by build.py, so
     the order is the order they are declared in and not a script's guess */
  .meta .chip { animation:chipin .5s cubic-bezier(.22,1,.36,1) both;
                animation-delay:calc(var(--i,0) * 55ms + 130ms); }
  @keyframes chipin { from { opacity:0; transform:translateY(7px); } }

  /* ---- reading progress ---- */
  .prog { position:fixed; top:0; left:0; height:2px; width:0; z-index:70;
          background:linear-gradient(90deg, var(--accent), var(--accent-2));
          transition:width .12s linear; pointer-events:none; }

  /* ---- abstract ---- */
  .abstract { background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent);
              border-radius:12px; padding:1.4em 1.6em; box-shadow:var(--shadow); margin:2.2em 0; }
  .abstract h3 { margin:0 0 .4em; font-size:.78rem; font-family:var(--mono); letter-spacing:.14em;
                 text-transform:uppercase; color:var(--accent); }
  .abstract p { margin:.6em 0; color:var(--text-2); }
  .abstract p:first-of-type { color:var(--text); }

  /* ---- callouts ---- */
  .note { background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
          padding:1.05em 1.3em; margin:1.8em 0; font-size:.96rem; color:var(--text-2); }
  .note.warn { background:var(--red-bg); border-color:color-mix(in srgb, var(--red) 32%, transparent); }
  .note.ok { background:var(--green-bg); border-color:color-mix(in srgb, var(--green) 32%, transparent); }
  .note .lbl { font-family:var(--mono); font-size:.71rem; letter-spacing:.11em; text-transform:uppercase;
               font-weight:700; display:block; margin-bottom:.4em; }
  .note.warn .lbl { color:var(--red); } .note.ok .lbl { color:var(--green); }
  .note:not(.warn):not(.ok) .lbl { color:var(--accent); }

  /* ---- code, as a window ---- */
  .codewin { margin:1.8em 0; border-radius:11px; overflow:hidden; border:1px solid var(--border-2);
             box-shadow:var(--shadow); background:var(--code-bg); }
  .codebar { display:flex; align-items:center; gap:7px; padding:.55em .9em;
             background:var(--code-bar); border-bottom:1px solid rgba(255,255,255,.05); }
  .codebar .d { width:11px; height:11px; border-radius:99px; }
  .codebar .d:nth-child(1){ background:#ff5f57; } .codebar .d:nth-child(2){ background:#febc2e; }
  .codebar .d:nth-child(3){ background:#28c840; }
  .codebar .t { margin-left:.7em; font-family:var(--mono); font-size:.72rem; color:var(--code-dim); }
  .codewin pre { margin:0; border:0; border-radius:0; box-shadow:none; }
  pre { background:var(--code-bg); color:var(--code-text); border-radius:10px; padding:1.05em 1.2em;
        overflow-x:auto; font-family:var(--mono); font-size:.82rem; line-height:1.7;
        border:1px solid var(--border-2); margin:1.6em 0; }
  pre .c { color:var(--code-dim); } pre .k { color:#e0aa46; }
  pre .r { color:#ea7a60; } pre .g { color:#5fc086; }

  /* ---- tables ---- */
  .tbl { overflow-x:auto; margin:1.8em 0; }
  table { border-collapse:collapse; width:100%; font-size:.92rem; }
  th,td { padding:.6em .75em; border-bottom:1px solid var(--border); text-align:left; }
  th { font-family:var(--mono); font-size:.74rem; letter-spacing:.06em; text-transform:uppercase;
       color:var(--text-dim); font-weight:700; border-bottom:1px solid var(--border-2); }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; font-family:var(--mono); }
  tbody tr:hover { background:var(--surface-2); }

  /* ---- figures ---- */
  figure { margin:2.8em 0; }
  .figbox { background:var(--surface); border:1px solid var(--border); border-radius:14px;
            padding:1.4em 1.5em 1.2em; box-shadow:var(--shadow); }
  figcaption { font-size:.87rem; color:var(--text-dim); margin-top:1em; line-height:1.65; }
  figcaption b { color:var(--text-2); }
  .figtitle { font-family:var(--mono); font-size:.73rem; letter-spacing:.13em; text-transform:uppercase;
              color:var(--accent); font-weight:700; margin-bottom:1em; display:flex;
              flex-wrap:wrap; align-items:center; gap:.6em; }
  .prov { font-family:var(--mono); font-size:.66rem; letter-spacing:.06em; padding:.15em .55em;
          border-radius:4px; border:1px solid var(--border-2); color:var(--text-dim);
          white-space:nowrap; }
  .prov.yes { color:var(--green); border-color:color-mix(in srgb, var(--green) 42%, transparent); }
  .prov.no { color:var(--red); border-color:color-mix(in srgb, var(--red) 42%, transparent); }

  .legend { display:flex; flex-wrap:wrap; gap:.45em; margin-bottom:1em; }
  .lg { display:inline-flex; align-items:center; gap:.5em; font-size:.79rem; font-family:var(--mono);
        background:var(--surface-2); border:1px solid var(--border); border-radius:99px;
        padding:.34em .85em; cursor:pointer; color:var(--text-dim); user-select:none;
        transition:color .25s, border-color .25s, background .25s, transform .18s; }
  .lg:hover { transform:translateY(-1px); border-color:var(--border-2); }
  /* flex:0 0 auto or the key squeezes the swatch: in a .lg with a long label
     the 9px dot was rendering at 3.3px, and a 15px dashed bar at 5px, which
     is most of why two stroke patterns were not telling apart. */
  .lg .sw { width:9px; height:9px; flex:0 0 auto; border-radius:99px; background:currentColor;
            opacity:.4; transition:opacity .25s, box-shadow .25s; }
  .lg.on { color:var(--c); border-color:currentColor; background:var(--surface); font-weight:600; }
  .lg.on .sw { opacity:1; box-shadow:0 0 0 3px color-mix(in srgb, currentColor 22%, transparent); }
  .hint { font-size:.77rem; color:var(--text-dim); font-family:var(--mono); margin-bottom:.85em; }

  svg.chart { width:100%; height:auto; display:block; overflow:visible; }
  /* the viewBox scales uniformly, so a narrow figure shrinks the axis text with
     it. Below the breakpoint the chart keeps a legible size and the box scrolls,
     which is what .covwrap already does for a wide grid. */
  @media (max-width:640px){
    .figbox > svg.chart { min-width:520px; }
    .figbox:has(> svg.chart) { overflow-x:auto; }
  }
  .grid line { stroke:var(--border); stroke-width:1; }
  .axis text { fill:var(--text-dim); font-family:var(--mono); font-size:10.5px; }
  .axis .ttl { fill:var(--text-2); font-size:11px; font-weight:700; }
  .ln { fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;
        transition:opacity .3s, stroke-width .3s; }
  .dot { transition:opacity .3s; cursor:pointer; }
  .dim { opacity:.14; } .dim.ln { stroke-width:1.6; }
  .rule { stroke-width:1.4; opacity:.75; }
  .rulab { font-family:var(--mono); font-size:10px; letter-spacing:.04em; }
  .dot { cursor:default; }
  .dot[data-tip] { cursor:pointer; }
  .tip { position:fixed; pointer-events:none; background:var(--code-bg); color:var(--code-text);
         font-family:var(--mono); font-size:.74rem; line-height:1.6; padding:.6em .8em;
         border-radius:8px; opacity:0; transition:opacity .14s; z-index:70; max-width:270px;
         box-shadow:0 10px 30px rgba(0,0,0,.34); border:1px solid var(--border-2); }
  .tip .hd { color:var(--accent-2); font-weight:700; }
  .tip .sub { color:var(--code-dim); }

  /* ---- bar charts: one grid per figure so every track shares a left edge ---- */
  .bars { display:grid; grid-template-columns:var(--labw, 150px) 1fr max-content;
          column-gap:1.1em; row-gap:.55em; align-items:center; }
  @media (max-width:640px){ .bars { --labw:104px; column-gap:.7em; } }
  .bars .lab { font-family:var(--mono); font-size:.78rem; color:var(--text-2);
               text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bars .track { background:var(--surface-3); border-radius:99px; height:20px; overflow:hidden; }
  .bars .fill { height:100%; border-radius:99px; width:0;
                transition:width 1s cubic-bezier(.22,1,.36,1); }
  .bars .val { font-family:var(--mono); font-size:.81rem; font-variant-numeric:tabular-nums;
               color:var(--text); font-weight:700; white-space:nowrap; }
  .bars .head { grid-column:1 / -1; font-family:var(--mono); font-size:.78rem;
                color:var(--text-2); margin:.9em 0 -.1em; }
  .bars .head:first-child { margin-top:0; }
  /* a group heading spans the whole row. It lived in four articles' own CSS and
     not in the fifth that used the class, whose rows then each took one cell
     and walked diagonally down the figure. */
  .bars .grp { grid-column:1 / -1; font-family:var(--mono); font-size:.79rem;
               color:var(--text); margin:1em 0 .1em; }
  .bars .grp:first-child { margin-top:0; }
  .bars .grp .tagline { color:var(--text-dim); font-size:.73rem; }
  .bars .foot { grid-column:2 / -1; font-family:var(--mono); font-size:.74rem;
                margin:-.25em 0 .5em; }
  .barunit { font-family:var(--mono); font-size:.75rem; color:var(--text-dim); margin-top:1em; }
  .bars > .barunit { grid-column:1 / -1; }

  /* .rv hides content until a script reveals it, so the one browser without
     IntersectionObserver would get a page of empty figure frames. The root
     carries the capability and the rule opts out. */
  .no-io .rv { opacity:1 !important; transform:none !important; }
  .rv { opacity:0; transform:translateY(14px);
        transition:opacity .6s ease, transform .6s cubic-bezier(.22,1,.36,1); }
  .rv.in { opacity:1; transform:none; }

  .foot-note { margin-top:4.2em; padding-top:1.7em; border-top:1px solid var(--border);
               font-size:.88rem; color:var(--text-dim); }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior:auto; }
    *, *::before, *::after { animation-duration:.001ms !important; animation-delay:.001ms !important;
                              transition-duration:.001ms !important; }
    .rv { opacity:1; transform:none; }
    .prog { transition:none; }
  }
</style>
</head>
<body>
<div class="prog" id="prog" aria-hidden="true"></div>
<nav class="themebar" aria-label="__NAVLABEL__">
__LANG_NAV__
  <span class="sep" aria-hidden="true"></span>
  <button id="th-auto" aria-pressed="false" title="__T_AUTO__">
    <svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 20h8"/></svg>
  </button>
  <button id="th-light" aria-pressed="false" title="__T_LIGHT__">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg>
  </button>
  <button id="th-dark" aria-pressed="false" title="__T_DARK__">
    <svg viewBox="0 0 24 24"><path d="M20 13.4A8.2 8.2 0 1 1 10.6 4a6.6 6.6 0 0 0 9.4 9.4z"/></svg>
  </button>
</nav>
<script id="chrome">
/* ---- the shared line chart ----
   Seven figures across four articles show a few series over an ordered axis --
   context length, almost always -- and were drawn as grouped bars, which makes
   a reader assemble the shape out of four lengths. One implementation lives
   here rather than seven in the bodies, for the same reason .bars .grp does:
   the copy an article did not have is the one that broke.

   window.lineChart(opts) -> { redraw }
     el       the <svg class="chart"> to draw into
     x        {values, label, fmt}          ordered, shared by every series
              {scale:"log"|"linear", min, max, ticks, label, fmt}   numeric instead
     y        {label, fmt, ticks, min, max, zero}
     series   [{label, colour, values, dash, dashPattern, dashSegs, tip}]
              values parallel to x.values. `dash` strokes the whole series
              dashed; `dashPattern` is its stroke-dasharray, default "6 5", for
              when two dashed series have to be told apart. NOT `dashSegs`,
              which is a list of *segment indices* drawn as a second, softer
              path -- passing a pattern string there silently splits the line,
              because "2 3".indexOf(2) is 0.
              or [{label, colour, points:[[x,y],...], ...}]   on a numeric x
     rules    [{y, label, at, colour, labelColour}]  horizontal reference lines
     band     {lo, hi}                               a shaded y range behind everything
     legend   an element to fill with one swatch per labelled series
     reduce   true to skip the draw-in animation
     fitLit   true to scale y to the lit series only, rather than to every
              series the chart holds, and to leave the unlit ones out of the
              drawing entirely. For a chart whose legend can switch most of its
              lines off this is the difference between an axis that describes
              what the reader is looking at and one set by a line they cannot
              see -- the index chart holds an A100 model peaking at 161 tok/s
              behind a default view whose own top is 108. The two halves go
              together: once the axis stops covering a series, dimming it
              rather than dropping it draws it off the top of the frame, which
              is worse than not drawing it -- a line that leaves and re-enters
              reads as a plateau it never had.
     lit      the initial predicate, so the first draw already fits and the
              first setLit finds nothing to change
   A null in a series' values is a gap, not a zero.
   Returns {redraw, setLit}: setLit(fn) dims every series for which fn(i) is
   false. Without fitLit it does not redraw, so a legend toggle does not replay
   the animation; with it, it redraws -- without animating -- whenever the set
   of shown series actually changed, and not otherwise. */
window.lineChart = function (opts) {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var el = opts.el, xs = opts.x.values, ser = opts.series, rules = opts.rules || [];
  var W = opts.w || 760, H = opts.h || 340;
  var M = opts.m || { t: 16, r: 18, b: 44, l: 62 };
  var tip = document.querySelector(".tip") || (function () {
    var t = document.createElement("div");
    t.className = "tip";
    document.body.appendChild(t);
    return t;
  })();

  function mk(n, a, style) {
    var e = document.createElementNS(NS, n);
    for (var k in a) e.setAttribute(k, a[k]);
    if (style) e.setAttribute("style", style);
    return e;
  }
  function show(ev, html) {
    tip.innerHTML = html;
    tip.style.opacity = "1";
    var r = tip.getBoundingClientRect();
    tip.style.left = Math.min(ev.clientX + 14, innerWidth - r.width - 10) + "px";
    tip.style.top = Math.max(8, ev.clientY - r.height - 12) + "px";
  }
  function hide() { tip.style.opacity = "0"; }

  var paths = [], dots = [], owner = [], dotOwner = [];
  var litFn = opts.lit || null, drawnKey = null;

  // Under fitLit a series the reader has switched off is not drawn at all, so
  // what has to be compared between draws is the set and not just the extent.
  function shown(i) { return !opts.fitLit || !litFn || litFn(i); }
  function litKey() {
    var k = "";
    ser.forEach(function (_, i) { k += shown(i) ? "1" : "0"; });
    return k;
  }

  // What sets the y axis. Under fitLit a series the reader has switched off
  // does not, which is the whole point; if that leaves nothing at all, the
  // frame stays as it was rather than collapsing onto an empty chart.
  function yvals() {
    var vals = [], all = !opts.fitLit || !litFn;
    function take(s) {
      if (s.points) { s.points.forEach(function (p) { vals.push(p[1]); }); return; }
      s.values.forEach(function (v) { if (v !== null && v !== undefined) vals.push(v); });
    }
    ser.forEach(function (s, i) { if (all || shown(i)) take(s); });
    if (!vals.length) ser.forEach(take);
    rules.forEach(function (r) { vals.push(r.y); });
    if (opts.band) { vals.push(opts.band.lo); vals.push(opts.band.hi); }
    return vals;
  }
  function yext() {
    var v = yvals();
    return [opts.y.min !== undefined ? opts.y.min : Math.min.apply(null, v),
            opts.y.max !== undefined ? opts.y.max : Math.max.apply(null, v)];
  }

  function draw(animate) {
    while (el.firstChild) el.removeChild(el.firstChild);
    paths = []; dots = []; owner = []; dotOwner = [];
    el.setAttribute("viewBox", "0 0 " + W + " " + H);
    el.setAttribute("preserveAspectRatio", "xMidYMid meet");

    var ext = yext(), lo = ext[0], hi = ext[1];
    drawnKey = litKey();
    if (opts.y.zero && lo > 0) lo = 0;
    var pad = (hi - lo) * 0.08 || 1;
    if (opts.y.min === undefined) lo -= pad;
    if (opts.y.max === undefined) hi += pad;
    var Y = function (v) { return H - M.b - (v - lo) / (hi - lo) * (H - M.t - M.b); };
    // Ordinal by default: a ladder of depths spaced by value buries 1K and 8K
    // against the left edge. A chart whose series do not share one ladder asks
    // for scale:"log" (or "linear") and gives each series its own points.
    var num = opts.x.scale === "log" || opts.x.scale === "linear";
    var lg = opts.x.scale === "log";
    var xall = [];
    if (num) {
      ser.forEach(function (s) {
        (s.points || []).forEach(function (p) { xall.push(p[0]); });
      });
      if (opts.x.ticks) opts.x.ticks.forEach(function (v) { xall.push(v); });
    }
    var xlo = num ? (opts.x.min !== undefined ? opts.x.min : Math.min.apply(null, xall)) : 0;
    var xhi = num ? (opts.x.max !== undefined ? opts.x.max : Math.max.apply(null, xall)) : 1;
    var xscale = function (v) { return lg ? Math.log(v) : v; };
    var X = function (i) {
      if (num) {
        return xhi === xlo ? (M.l + W - M.r) / 2
          : M.l + (xscale(i) - xscale(xlo)) / (xscale(xhi) - xscale(xlo)) * (W - M.l - M.r);
      }
      return xs.length === 1 ? (M.l + W - M.r) / 2
        : M.l + i / (xs.length - 1) * (W - M.l - M.r);
    };

    var ticks = opts.y.ticks;
    if (!ticks) {
      // round tick values, not five equal slices of whatever the data spans:
      // an axis reading -42, -31, -19, -8, 3 is arithmetic the reader has to do
      var raw = (hi - lo) / 4;
      var mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
      var step = [1, 2, 2.5, 5, 10].reduce(function (a, m) {
        return Math.abs(m * mag - raw) < Math.abs(a * mag - raw) ? m : a; }, 1) * mag;
      ticks = [];
      for (var t = Math.ceil(lo / step) * step; t <= hi + 1e-9; t += step) ticks.push(t);
    }
    var g = mk("g", { "class": "grid" });
    ticks.forEach(function (v) {
      if (v < lo || v > hi) return;
      g.appendChild(mk("line", { x1: M.l, x2: W - M.r, y1: Y(v), y2: Y(v) }));
    });
    el.appendChild(g);

    var ax = mk("g", { "class": "axis" });
    ticks.forEach(function (v) {
      if (v < lo || v > hi) return;
      var n = mk("text", { x: M.l - 10, y: Y(v) + 3.5, "text-anchor": "end" });
      n.textContent = (opts.y.fmt || String)(v);
      ax.appendChild(n);
    });
    (num ? (opts.x.ticks || []) : xs).forEach(function (v, i) {
      var n = mk("text", { x: X(num ? v : i), y: H - M.b + 20, "text-anchor": "middle" });
      n.textContent = (opts.x.fmt || String)(v);
      ax.appendChild(n);
    });
    if (opts.x.label) {
      var xt = mk("text", { x: (M.l + W - M.r) / 2, y: H - 6, "text-anchor": "middle",
                            "class": "ttl" });
      xt.textContent = opts.x.label;
      ax.appendChild(xt);
    }
    if (opts.y.label) {
      var yt = mk("text", { x: -(H - M.b + M.t) / 2, y: 15, "text-anchor": "middle",
                            "class": "ttl", transform: "rotate(-90)" });
      yt.textContent = opts.y.label;
      ax.appendChild(yt);
    }
    el.appendChild(ax);

    if (opts.band) {
      // the spread the individual cells occupy, behind the medians: without it
      // a reader has no scale against which "flat" means anything
      el.appendChild(mk("rect", { x: M.l, y: Y(opts.band.hi), width: W - M.l - M.r,
                                  height: Math.abs(Y(opts.band.lo) - Y(opts.band.hi)) },
                        "fill:var(--surface-3);opacity:.55"));
    }
    rules.forEach(function (r) {
      if (r.y < lo || r.y > hi) return;
      el.appendChild(mk("line", { x1: M.l, x2: W - M.r, y1: Y(r.y), y2: Y(r.y),
                                  "class": "rule" },
                        "stroke:" + (r.colour || "var(--border-2)") +
                        (r.dash === false ? "" : ";stroke-dasharray:5 4")));
      if (!r.label) return;
      // a rule label sits where the data often is, so it carries its own
      // backing rather than printing on top of a line
      var ry = Y(r.y) < M.t + 18 ? Y(r.y) + 15 : Y(r.y) - 6;
      var left = r.at === "left";
      var g2 = mk("g", { "class": "rulab" });
      var n = mk("text", { x: left ? M.l + 4 : W - M.r - 4, y: ry,
                           "text-anchor": left ? "start" : "end" },
                 "fill:" + (r.labelColour || "var(--text-dim)"));
      n.textContent = r.label;
      g2.appendChild(n);
      el.appendChild(g2);
      var bb = n.getBBox();
      var bg = mk("rect", { x: bb.x - 4, y: bb.y - 1.5, width: bb.width + 8,
                            height: bb.height + 3, rx: 3 },
                  "fill:var(--surface)");
      g2.insertBefore(bg, n);
    });

    ser.forEach(function (s, si) {
      if (!shown(si)) return;
      var soft = s.dashSegs || [];
      var vs = s.points ? s.points.map(function (p) { return p[1]; }) : s.values;
      var at = s.points
        ? function (i) { return X(s.points[i][0]); }
        : function (i) { return X(i); };
      var firm = "", loose = "", open = false;
      vs.forEach(function (v, i) {
        if (v === null || v === undefined) { open = false; return; }
        var here = at(i) + " " + Y(v);
        if (!open) { firm += " M" + here; open = true; return; }
        if (soft.indexOf(i - 1) >= 0) {
          loose += " M" + at(i - 1) + " " + Y(vs[i - 1]) + " L" + here;
          firm += " M" + here;
        } else {
          firm += " L" + here;
        }
      });
      var p = mk("path", { "class": "ln", d: firm.trim() },
                 "stroke:" + s.colour +
                 (s.dash ? ";stroke-dasharray:" + (s.dashPattern || "6 5") : ""));
      el.appendChild(p);
      paths.push(p); owner.push(si);
      if (loose) {
        var lp = mk("path", { "class": "ln", d: loose.trim() },
                    "stroke:" + s.colour + ";stroke-dasharray:4 5;opacity:.75");
        el.appendChild(lp);
        paths.push(lp); owner.push(si);
      }
      var dg = [];
      vs.forEach(function (v, i) {
        if (v === null || v === undefined) return;
        var c = mk("circle", { "class": "dot", cx: at(i), cy: Y(v), r: 4.2 },
                   "stroke:" + s.colour + ";stroke-width:2;fill:var(--surface)");
        if (s.tip) {
          c.setAttribute("data-tip", "");
          c.addEventListener("mouseenter", function (e) { show(e, s.tip(i)); });
          c.addEventListener("mousemove", function (e) { show(e, tip.innerHTML); });
          c.addEventListener("mouseleave", hide);
        }
        el.appendChild(c);
        dg.push(c);
      });
      dots.push(dg); dotOwner.push(si);
    });

    if (!animate || opts.reduce) return;
    // the lines draw themselves in, and every dot created by this redraw is
    // faded in by this redraw: an observer set up on an earlier pass would
    // never see these nodes
    paths.forEach(function (p) {
      // The draw-in borrows stroke-dasharray to hide the line, so whatever
      // pattern the series asked for has to be handed back when it finishes.
      // Without this every dashed line ends up solid once the animation has
      // run, and a key that distinguishes them by stroke is describing
      // something the reader cannot see.
      var want = p.style.strokeDasharray;
      var L = p.getTotalLength();
      p.style.strokeDasharray = L;
      p.style.strokeDashoffset = L;
      p.getBoundingClientRect();
      p.style.transition = "stroke-dashoffset 1.3s cubic-bezier(.22,1,.36,1)";
      p.style.strokeDashoffset = "0";
      setTimeout(function () {
        p.style.transition = "";
        p.style.strokeDasharray = want;
        p.style.strokeDashoffset = "";
      }, 1400);
    });
    dots.forEach(function (dg) {
      dg.forEach(function (c, i) {
        c.style.opacity = "0";
        setTimeout(function () { c.style.opacity = ""; }, 300 + i * 60);
      });
    });
  }

  if (opts.legend) {
    // the key belongs to the chart, so a series and its swatch cannot drift and
    // no article has to carry its own swatch helper for this
    opts.legend.innerHTML = "";
    ser.forEach(function (s) {
      if (!s.label) return;
      var g = document.createElement("div");
      g.className = "lg on";
      g.style.setProperty("--c", s.colour);
      g.style.cursor = "default";
      var sw = document.createElement("div");
      sw.className = "sw";
      // A dashed series needs a dashed swatch. Without this, two lines that
      // differ only in stroke pattern arrive in the key as the same dot, and a
      // figure drawing one machine's arms in one colour hands the reader three
      // labels and one swatch.
      if (s.dash) {
        var seg = String(s.dashPattern || "6 5").split(/[ ,]+/).map(Number);
        var on = seg[0] || 5, off = seg[1] || 4, sc = 1.4;
        sw.className = "sw dash";
        sw.style.width = "15px";
        sw.style.height = "3px";
        sw.style.borderRadius = "1px";
        sw.style.background =
          "repeating-linear-gradient(90deg, currentColor 0 " + (on * sc).toFixed(1) +
          "px, transparent " + (on * sc).toFixed(1) + "px " +
          ((on + off) * sc).toFixed(1) + "px)";
      }
      g.appendChild(sw);
      var t = document.createElement("span");
      t.textContent = s.label;
      g.appendChild(t);
      opts.legend.appendChild(g);
    });
  }

  function setLit(fn) {
    litFn = fn;
    // Under fitLit the axis and the drawing both belong to what is lit, so a
    // toggle rebuilds -- but only when it actually changed the set. The first
    // call lands while the draw-in is still running and must find nothing to
    // change, which is what opts.lit is for.
    if (opts.fitLit && litKey() !== drawnKey) draw(false);
    // a series can own two paths when part of it is drawn as an inference
    paths.forEach(function (p, i) { p.classList.toggle("dim", !fn(owner[i])); });
    dots.forEach(function (dg, i) {
      dg.forEach(function (c) { c.classList.toggle("dim", !fn(dotOwner[i])); });
    });
  }

  draw(true);
  return { redraw: draw, setLit: setLit };
};

if (!window.IntersectionObserver) document.documentElement.classList.add("no-io");

addEventListener("DOMContentLoaded", function () {
  "use strict";
  var bar = document.getElementById("prog"), queued = false;
  function draw() {
    var h = document.documentElement.scrollHeight - innerHeight;
    bar.style.width = (h > 0 ? Math.min(1, Math.max(0, scrollY / h)) * 100 : 0) + "%";
    queued = false;
  }
  addEventListener("scroll", function () {
    if (queued) return;
    queued = true;
    requestAnimationFrame(draw);
  }, { passive: true });
  addEventListener("resize", draw, { passive: true });
  draw();

  // The section numbers settle in with their heading. Headings come from the
  // source and are never redrawn, so one observer over them cannot miss a node
  // the way it would for anything a figure rebuilds -- and the start state is
  // dim rather than hidden, so a paused observer costs a shade of colour and
  // not the number itself.
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if (!window.IntersectionObserver) return;
  var ns = document.querySelectorAll("h2 .n");
  Array.prototype.forEach.call(ns, function (n) { n.classList.add("nq"); });
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      e.target.classList.add("nin");
      io.unobserve(e.target);
    });
  }, { threshold: 1 });
  Array.prototype.forEach.call(ns, function (n) { io.observe(n); });
});
</script>
